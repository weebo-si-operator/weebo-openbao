                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              orphanedAuth:
                description: Backends this operator enabled, no longer declared, left enabled.
                items:
                  type: string
                type: array
              orphanedMounts:
                description: '`orgs` or `users` mounts no longer declared, left with their secrets.'
                items:
                  type: string
                type: array
              remoteId:
                description: |-
                  Identifier of the remote object, as Openbao returned it. Its
