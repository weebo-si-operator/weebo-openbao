apiVersion: v2
name: weebo-openbao
description: Kubernetes operator managing Openbao objects as CRDs.
type: application
version: 0.1.3
appVersion: "0.1.3"
# Native `preStop: sleep` and the admission/policy APIs used here.
kubeVersion: ">=1.30.0-0"
home: https://github.com/weebo-si-operator/weebo-openbao
sources:
  - https://github.com/weebo-si-operator/weebo-openbao
keywords:
  - openbao
  - operator
  - kubernetes-operator
  - crd
maintainers:
  - name: batleforc
    url: https://github.com/batleforc
dependencies:
  # Every resource but the CRDs (templates/operator.yaml); its version is
  # the kit's, as in Cargo.toml (`task kit:sync` keeps them in step).
  - name: weebo-operator-lib
    version: 0.30.0
    repository: oci://ghcr.io/weebo-si-operator/charts
