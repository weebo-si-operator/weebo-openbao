apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openbaoinstances.openbao.weebo.io
spec:
  group: openbao.weebo.io
  names:
    kind: OpenbaoInstance
    plural: openbaoinstances
    singular: openbaoinstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for OpenbaoInstanceSpec via `CustomResource`
        properties:
          spec:
            description: |-
              The OpenBao server the spaces live on, and the operator's login there:
              Kubernetes auth in the root, with the operator's ServiceAccount (no
              static token). `Ready` tells whether OpenBao answers and accepts the
              login.
            properties:
              address:
                description: OpenBao's address, e.g. `https://openbao.vault:8200`. `https` only.
                maxLength: 256
                pattern: ^https://[^\s/]+(:[0-9]+)?/?$
                type: string
              auth:
                description: The operator's login.
                properties:
                  kubernetes:
                    description: Kubernetes auth in OpenBao's root namespace.
                    properties:
                      mount:
                        default: kubernetes
                        maxLength: 128
                        minLength: 1
                        type: string
                      role:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - role
                    type: object
                required:
                - kubernetes
                type: object
              bounds:
                default:
                  namespaces: []
                description: |-
                  The OpenBao namespaces the operator's bootstrap policy lets it write
                  to: an `OpenbaoNamespace` outside them is refused before any call.
                  It can't widen anything, the policy stays the bound.
                properties:
                  namespaces:
                    default: []
                    items:
                      maxLength: 16
                      pattern: ^[a-z]([a-z0-9-]{0,14}[a-z0-9])?$
                      type: string
                    maxItems: 16
                    type: array
                type: object
              tls:
                description: |-
                  The CA of OpenBao's certificate, `None` for the system trust store.
                  No option turns the verification off.
                nullable: true
                properties:
                  caSecretRef:
                    description: The PEM bundle, in a key of a Secret.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                required:
                - caSecretRef
                type: object
            required:
            - address
            - auth
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Ready`, carrying one of the operator''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: |-
                  The instance this object was resolved to and stays bound to: a
                  `spec.instanceRef` by name only never silently moves to another
                  instance created later under the same name.
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              observedGeneration:
                description: The `metadata.generation` the last successful reconcile applied.
                format: int64
                nullable: true
                type: integer
              remoteId:
                description: |-
                  Identifier of the remote object, as Openbao returned it. Its
                  presence means this CR created (and owns) that object: the
                  finalizer only deletes what is recorded here.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: OpenbaoInstance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
